name: CI

on:
  push:
  pull_request:

env:
  GODOT_VERSION: "4.5.1"

jobs:
  fast:
    name: lint, compile, fast tests, network, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Sim determinism lint
        run: python3 tools/lint_sim.py
      - uses: ./.github/actions/godot
        with:
          version: ${{ env.GODOT_VERSION }}
      - name: Compile all scripts
        run: ~/godot/godot --headless --path . -s res://tools/check_scripts.gd
      - name: Fast tests
        run: ~/godot/godot --headless --path . -s res://tests/run.gd -- --fast
      - name: Two-process lockstep over ENet
        run: tools/net_selftest.sh ~/godot/godot
      - name: Scene smoke test
        run: |
          ~/godot/godot --headless --path . -s res://tests/smoke_scene.gd 2>&1 | tee smoke.log
          test ${PIPESTATUS[0]} -eq 0
          ! grep -qE "SCRIPT ERROR|^ERROR" smoke.log

  acceptance:
    name: milestone acceptance + soak (slow)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/godot
        with:
          version: ${{ env.GODOT_VERSION }}
      - name: Slow tests
        run: ~/godot/godot --headless --path . -s res://tests/run.gd -- --slow
