name: CI

on:
  push:
  pull_request:

env:
  GODOT_VERSION: "4.5.1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Sim determinism lint
        run: python3 tools/lint_sim.py

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot

      - name: Import project (builds class_name cache)
        run: ~/godot/godot --headless --path . --import

      - name: Compile all scripts
        run: ~/godot/godot --headless --path . -s res://tools/check_scripts.gd

      - name: Run headless tests
        run: |
          ~/godot/godot --headless --path . -s res://tests/run.gd 2>&1 | tee test.log
          test ${PIPESTATUS[0]} -eq 0
          ! grep -q "SCRIPT ERROR" test.log

      - name: Scene smoke test
        run: |
          ~/godot/godot --headless --path . -s res://tests/smoke_scene.gd 2>&1 | tee smoke.log
          test ${PIPESTATUS[0]} -eq 0
          ! grep -qE "SCRIPT ERROR|^ERROR" smoke.log
