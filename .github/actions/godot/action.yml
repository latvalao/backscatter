name: Set up Godot
description: Download (cached) Godot and import the project
inputs:
  version:
    description: Godot version
    required: true
runs:
  using: composite
  steps:
    - name: Cache Godot
      id: cache-godot
      uses: actions/cache@v4
      with:
        path: ~/godot
        key: godot-${{ inputs.version }}
    - name: Download Godot
      if: steps.cache-godot.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/godot
        curl -sSL -o /tmp/godot.zip \
          "https://github.com/godotengine/godot/releases/download/${{ inputs.version }}-stable/Godot_v${{ inputs.version }}-stable_linux.x86_64.zip"
        unzip -q /tmp/godot.zip -d ~/godot
        mv ~/godot/Godot_v${{ inputs.version }}-stable_linux.x86_64 ~/godot/godot
    - name: Import project (builds class_name cache)
      shell: bash
      run: ~/godot/godot --headless --path . --import
